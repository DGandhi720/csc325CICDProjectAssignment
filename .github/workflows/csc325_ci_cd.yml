name: CI/CD Pipeline for CSC325 Django Assignment

on:
  push:
    branches:
      - main

jobs:
  # Stage 1: Check out the code and install the tutorial's Python version.
  setup:
    name: Setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

  # Stage 2: Before running tests, this will simply just install any needing dependencies.
  dependencies:
    name: Dependencies
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install packages
        run: python -m pip install -r requirements.txt

  # Stage 3: Runs the Django test suite; if any fails occur, it'll stop the pipeline.
  test:
    name: Test
    needs: dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install packages
        run: python -m pip install -r requirements.txt

      - name: Run Django tests
        run: python manage.py test

  # Stage 4: And once all tests are passed, this will run the deploy, the final step.
  deploy:
    name: Deploy
    # This dependency prevents Deploy from starting unless Test passes.
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        run: echo "Deploying the application..."
